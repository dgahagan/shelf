[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: End-to-end browser tests (require Playwright)
filterwarnings =
    # pytest-asyncio 0.25.3 internally calls the deprecated asyncio
    # get_event_loop_policy/set_event_loop_policy; under Python 3.14 that emits
    # ~840 warnings per run that no change in this repo can fix. Matched by
    # message, not by blanket category, so genuine new deprecations still
    # surface (including other asyncio ones).
    ignore:'asyncio\.(get|set)_event_loop_policy' is deprecated:DeprecationWarning
