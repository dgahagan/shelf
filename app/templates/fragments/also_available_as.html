{# Keep an empty target so linking the first format can replace it in place. #}
<div id="also-available-as"{% if linked_items %} class="mb-4"{% endif %}{% if also_available_oob %} hx-swap-oob="outerHTML"{% endif %}>
    {% if linked_items %}
    <p class="text-xs text-shelf-muted mb-1">{{ _('Also available as:') }}</p>
    <div class="flex flex-wrap gap-2">
        {% for li in linked_items %}
        <a href="/item/{{ li.id }}{% if back.key %}?from={{ back.key }}{% endif %}" class="px-2 py-1 bg-shelf-hover rounded-sm text-xs text-shelf-text hover:bg-shelf-border transition-colors">
            {{ (_(media_types[li.media_type]) if li.media_type in media_types else li.media_type) }}
        </a>
        {% endfor %}
    </div>
    {% endif %}
</div>
