<div x-show="tab === 'integrations'" class="mt-8" id="komga-panel" style="display:none">
    <div class="bg-shelf-card rounded-xl border border-shelf-border p-6">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h2 class="text-lg font-semibold">Komga</h2>
                <p class="text-xs text-shelf-muted mt-1">Sync Comics and Manga libraries while keeping digital availability separate from physical location.</p>
            </div>
        </div>

        <div class="space-y-3">
            <div>
                <label for="komga-url" class="block text-sm font-medium text-shelf-muted mb-1">Komga URL</label>
                <input id="komga-url" type="url" placeholder="http://komga:25600"
                       class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:ring-2 focus:ring-shelf-accent outline-none">
            </div>
            <div>
                <label for="komga-public-url" class="block text-sm font-medium text-shelf-muted mb-1">Browser URL <span class="font-normal">(optional)</span></label>
                <input id="komga-public-url" type="url" placeholder="https://komga.example.com"
                       class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:ring-2 focus:ring-shelf-accent outline-none">
                <p class="mt-1 text-xs text-shelf-muted">Use this when Shelf reaches Komga over Docker/LAN but browsers use a reverse-proxy address.</p>
            </div>
            <div>
                <label for="komga-api-key" class="block text-sm font-medium text-shelf-muted mb-1">API key</label>
                <input id="komga-api-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved key"
                       class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:ring-2 focus:ring-shelf-accent outline-none">
            </div>
            <label class="flex items-center gap-2 text-xs text-shelf-muted">
                <input id="komga-clear-key" type="checkbox" class="rounded border-shelf-border"> Remove saved API key
            </label>
            <div class="flex flex-wrap gap-2">
                <button id="komga-save" type="button" class="px-4 py-2 bg-shelf-accent text-white rounded-lg text-sm hover:bg-shelf-accent2 transition-colors">Save</button>
                <button id="komga-test" type="button" class="px-4 py-2 bg-shelf-hover text-shelf-text rounded-lg text-sm hover:bg-shelf-border transition-colors">Test Connection</button>
            </div>
            <p id="komga-status" class="text-xs text-shelf-muted min-h-5"></p>
        </div>

        <div class="mt-5 pt-4 border-t border-shelf-border">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <p class="text-sm font-medium">Libraries</p>
                    <p class="text-xs text-shelf-muted">Choose which libraries Shelf imports and explicitly classify each as Comics or Manga.</p>
                </div>
                <button id="komga-load-libraries" type="button" class="px-3 py-1.5 bg-shelf-hover text-shelf-text rounded-lg text-xs hover:bg-shelf-border transition-colors shrink-0">Manage Libraries</button>
            </div>
            <div id="komga-libraries" class="mt-3 space-y-2"></div>
            <button id="komga-save-libraries" type="button" hidden class="mt-3 px-3 py-1.5 bg-shelf-accent text-white rounded-lg text-xs hover:bg-shelf-accent2 transition-colors">Save Library Selection</button>
        </div>

        <div class="mt-5 pt-4 border-t border-shelf-border">
            <button id="komga-sync" type="button" class="px-4 py-2 bg-shelf-hover text-shelf-text rounded-lg text-sm hover:bg-shelf-border transition-colors">Sync Now</button>
            <div id="komga-progress" class="mt-3 text-xs text-shelf-muted"></div>
            <div class="mt-2 w-full bg-shelf-bg rounded-full h-2">
                <div id="komga-progress-bar" class="bg-shelf-accent rounded-full h-2 transition-all duration-200" style="width:0%"></div>
            </div>
            <p id="komga-result" class="mt-2 text-xs text-shelf-muted"></p>
        </div>
    </div>
</div>
<script src="/static/js/komga-settings.js" defer></script>
