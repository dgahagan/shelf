{% if items %}
<template x-if="viewMode === 'grid'">
<div class="cover-grid" data-testid="item-grid">
    {% for item in items %}
    {% include "fragments/item_card.html" %}
    {% endfor %}
    {% if has_more is defined and has_more %}
    <div id="load-more" class="col-span-full text-center py-4"
         hx-get="{{ load_more_url }}" hx-trigger="revealed" hx-swap="outerHTML" hx-include="[name='view']">
        <div class="inline-block w-6 h-6 border-2 border-shelf-border border-t-shelf-accent rounded-full animate-spin"></div>
    </div>
    {% endif %}
</div>
</template>
<template x-if="viewMode === 'list'">
<div class="overflow-x-auto">
    <table class="w-full text-left">
        {# Headers derive from app/browse_columns.py -- one <th> in this file,
           looped, so a column can never exist here and not in item_row.html.
           The picker-managed columns carry no responsive hide-at-a-breakpoint
           classes: a Tailwind class rule and x-show's inline style cannot both
           own a cell's visibility, so the user's selection is authoritative at
           every width and a wide selection scrolls inside .overflow-x-auto. #}
        <thead>
            <tr class="border-b border-shelf-border text-shelf-muted text-xs uppercase tracking-wider">
                {% for col in browse_columns %}
                <th {% if col.name == 'select' %}x-show="selectMode"{% elif not col.locked %}x-show="visibleCols.{{ col.name }}"{% endif %}
                    data-col="{{ col.name }}"
                    class="px-3 py-2{% if col.name == 'select' %} w-8{% elif col.name == 'cover' %} w-10{% endif %}">{{ col.label }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            {% include "fragments/item_row.html" %}
            {% endfor %}
            {% if has_more is defined and has_more %}
            <tr id="load-more"
                hx-get="{{ load_more_url }}" hx-trigger="revealed" hx-swap="outerHTML" hx-include="[name='view']">
                <td colspan="{{ browse_columns|length }}" class="text-center py-4">
                    <div class="inline-block w-6 h-6 border-2 border-shelf-border border-t-shelf-accent rounded-full animate-spin"></div>
                </td>
            </tr>
            {% endif %}
        </tbody>
    </table>
</div>
</template>
{% else %}
<div class="text-center py-20" data-testid="empty-state">
    <svg class="mx-auto mb-4 w-16 h-16 text-shelf-border" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        {% if has_filters %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        {% else %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        {% endif %}
    </svg>
    {% if has_filters %}
    <p class="text-shelf-muted text-lg mb-2">No items match your filters</p>
    <button @click="clearAllFilters()"
            class="text-shelf-accent2 hover:text-shelf-accent inline-block cursor-pointer">Clear all filters</button>
    {% else %}
    <p class="text-shelf-muted text-lg mb-2">No items found</p>
    <a href="/scan" class="text-shelf-accent2 hover:text-shelf-accent inline-block">Start scanning books</a>
    {% endif %}
</div>
{% endif %}
{% include "fragments/filter_counts_oob.html" %}
