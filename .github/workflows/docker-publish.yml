name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Optional image tag override (e.g. "beta", "test")'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token Sigstore signs the provenance attestation with
      attestations: write   # store the attestation on this repository

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Third-party actions in this job are pinned by commit SHA, not by tag:
      # they run with the Docker Hub write token in scope, and a tag can be
      # moved to different code. Bump the SHA and the version comment together.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: dangahagan/shelf
          tags: |
            # For "v1.2.3" → "1.2.3"
            type=semver,pattern={{version}}
            # For "v1.2.3" → "1.2"
            type=semver,pattern={{major}}.{{minor}}
            # For "v1.2.3-beta.1" → tag includes the prerelease
            type=semver,pattern={{version}}
            # Tag "beta" on any prerelease tag containing "beta"
            type=raw,value=beta,enable=${{ contains(github.ref, 'beta') }}
            # Tag "latest" only on stable (non-prerelease) tags
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            # Manual dispatch override
            type=raw,value=${{ inputs.tag_override }},enable=${{ inputs.tag_override != '' }}

      - name: Build image for secret scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dangahagan/shelf:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the secret scanner, then drop the Docker Hub login
        # The scan mounts docker.sock, which is root on the runner, so the
        # scanner must not run while the Docker Hub token sits in
        # ~/.docker/config.json. Pull it while still logged in (authenticated
        # pull limits), then log out. The next login-action step logs back in
        # for the push. The image is pinned by digest because a mutable tag
        # would run new code with root on the runner.
        # trufflehog 3.97.6 — https://github.com/trufflesecurity/trufflehog (AGPL-3.0),
        # Docker Hub is the registry its own README points at.
        run: |
          docker pull trufflesecurity/trufflehog@sha256:cc1a591e83fec7bf56f64c15beaaa5d8e3d179a4165a03a087d07165296ef7df
          docker logout

      - name: Scan image for leaked secrets
        # Fails the publish if trufflehog finds a *verified* secret baked into
        # any layer. Unverified matches are ignored — the python base image
        # ships docstring examples (user:pass@host) that would false-positive.
        # `docker://` reads the image just built from the local daemon; without
        # it trufflehog looks the tag up on Docker Hub, finds nothing, and still
        # exits 0 — it scanned 0 bytes on every publish until 2026-09-23.
        # `--no-update` stops it replacing the pinned binary with the newest
        # release at run time. Neither `--fail` nor `--fail-on-scan-errors`
        # fails on an unreadable image, hence the byte-count check.
        run: |
          set -o pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            trufflesecurity/trufflehog@sha256:cc1a591e83fec7bf56f64c15beaaa5d8e3d179a4165a03a087d07165296ef7df docker \
            --image docker://dangahagan/shelf:scan --results=verified --fail --no-update \
            2>&1 | tee "$RUNNER_TEMP/trufflehog.log"
          grep -q '"bytes": [1-9]' "$RUNNER_TEMP/trufflehog.log" || { echo "::error::The secret scan read 0 bytes of the image"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        # Signed SLSA provenance for the pushed image, verifiable with
        # `gh attestation verify oci://index.docker.io/dangahagan/shelf:X.Y.Z --repo dgahagan/shelf`.
        # Runs before the description update, so a description that claims
        # provenance is never published for an image that has none.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/dangahagan/shelf
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub description
        # Needs DOCKERHUB_TOKEN to have Read, Write & Delete scope (Docker
        # Hub's description API rejects lesser scopes with 403). Non-fatal so
        # a description hiccup never blocks the image publish.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dangahagan/shelf
          readme-filepath: ./DOCKERHUB_README.md
          short-description: "Self-hosted home library catalog — barcode & shelf-photo scanning, metadata, lending, offline PWA"
